name: US Night Trader

on:
  # 운영 중지(2026-08-28, 사용자 지시): 자동 실행 스케줄 제거.
  # workflow_dispatch는 남겨둬 필요 시 수동 실행 가능.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run 모드 (true/false)'
        required: false
        default: 'false'
      mode:
        description: 'loop (연속감시) / once (1회) / refresh (대시보드만)'
        required: false
        default: 'loop'

# mode별로 concurrency 그룹 분리 → portfolio refresh가 진행 중 loop 살해 X
concurrency:
  group: us-night-trader-${{ github.event.inputs.mode || 'loop' }}
  # loop는 안 죽임, once/refresh는 사용자가 의도적으로 새로고침
  cancel-in-progress: ${{ github.event.inputs.mode != 'loop' && github.event.inputs.mode != '' }}

env:
  TZ: Asia/Seoul

jobs:
  us-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 400  # 최대 ~7시간 커버 (23:30~06:00)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pykrx hmmlearn optuna lightgbm scikit-learn yfinance

      - name: Create .env
        run: |
          cat > .env <<'ENVEOF'
          MODE=live
          KIS_APPKEY=${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET=${{ secrets.KIS_APPSECRET }}
          KIS_HTSID=${{ secrets.KIS_HTSID }}
          KIS_ACCOUNT_NO=${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PROD_CODE=01
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Download trade log
        uses: actions/download-artifact@v4
        with:
          name: trade-log
          path: logs/
        continue-on-error: true

      - name: Download US positions
        uses: actions/download-artifact@v4
        with:
          name: us-positions-state
          path: logs/
        continue-on-error: true

      - name: Download learning data
        uses: actions/download-artifact@v4
        with:
          name: learning-data
          path: logs/
        continue-on-error: true

      - name: Download bear state
        uses: actions/download-artifact@v4
        with:
          name: bear-state
          path: logs/
        continue-on-error: true

      - name: Download US slippage samples
        uses: actions/download-artifact@v4
        with:
          name: us-slippage-log
          path: logs/
        continue-on-error: true

      - name: Download killswitch state
        uses: actions/download-artifact@v4
        with:
          name: killswitch-state
          path: logs/
        continue-on-error: true

      - name: Download SQLite ledger
        uses: actions/download-artifact@v4
        with:
          name: ledger-db
          path: logs/
        continue-on-error: true

      # canonical trades.csv 복원 (캐리 포지션 손절 관리용)
      - name: Restore canonical trades.csv
        run: |
          mkdir -p logs
          curl -fsSL "https://raw.githubusercontent.com/BudongJW/kis-trading-journal/main/state/trades.csv" -o logs/trades.csv \
            && echo "canonical trades.csv 복원" || echo "canonical 없음"
        continue-on-error: true

      # us_positions.json git 영속화: artifact는 이전 run을 못 봐 매 run 리셋 →
      # 세션이 중간에 죽으면 US 보유분이 유령이 되는 문제(KR -14% 사태의 US판) 방지.
      - name: Restore us_positions.json
        run: |
          mkdir -p logs
          curl -fsSL "https://raw.githubusercontent.com/BudongJW/kis-trading-journal/main/state/us_positions.json" -o logs/us_positions.json \
            && echo "us_positions.json 복원(git canonical)" || echo "us_positions 없음 — 캐리 흡수로 보완"
        continue-on-error: true

      # 학습 상태 복원 (LGBM 모델·경험·정확도 — repo state/learning)
      - name: Restore learning state
        run: |
          mkdir -p logs
          if [ -d state/learning ]; then
            cp -f state/learning/* logs/ 2>/dev/null && echo "학습 상태 복원" || echo "학습 상태 일부 없음"
          fi
        continue-on-error: true

      - name: Run US night bot
        env:
          PYTHONPATH: '.'
          PYTHONIOENCODING: 'utf-8'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          MODE="${{ github.event.inputs.mode || 'loop' }}"
          if [ "$MODE" = "once" ]; then
            python -m src.bot.night_run $DRY_RUN_FLAG
          else
            python -m src.bot.night_run --loop $DRY_RUN_FLAG
          fi

      - name: Checkout journal repo
        if: always()
        uses: actions/checkout@v4
        with:
          repository: BudongJW/kis-trading-journal
          token: ${{ secrets.JOURNAL_PAT }}
          path: journal
        continue-on-error: true

      - name: Update journal (portfolio + trades 누적)
        if: always()
        env:
          PYTHONPATH: '.'
          PYTHONIOENCODING: 'utf-8'
        run: |
          git -C journal config user.name "kis-autotrader-bot"
          git -C journal config user.email "bot@kis-autotrader"
          # 커밋 라벨을 KST 시각에 맞춰 정직하게 (env: TZ=Asia/Seoul). 밤 21~07시는
          # 미국 야간, 그 외는 watchdog/장외 새로고침.
          H=$((10#$(date +'%H'))); HM=$(date +'%H:%M')
          if [ "$H" -ge 21 ] || [ "$H" -le 7 ]; then MSG="auto: 미국장 야간 업데이트 $HM"; else MSG="auto: 장외 새로고침(미국장 마감) $HM"; fi
          # canonical trades.csv에 이번 run 거래를 union 누적 후 portfolio 재생성·푸시(재시도).
          for i in 1 2 3; do
            git -C journal fetch origin main && git -C journal reset --hard origin/main
            python -m src.merge_trades journal/state/trades.csv logs/trades.csv || true
            cp journal/state/trades.csv logs/trades.csv 2>/dev/null || true
            # us_positions.json도 canonical로 영속화(세션 사망 시 다음 run이 기억)
            mkdir -p journal/state
            [ -s logs/us_positions.json ] && cp logs/us_positions.json journal/state/us_positions.json || true
            python -m src.journal_quick || true
            git -C journal add -A
            if git -C journal diff --cached --quiet; then echo "변경 없음"; break; fi
            git -C journal commit -m "$MSG"
            if git -C journal push; then echo "푸시 완료"; break; else echo "푸시 거부 — 재시도 $i"; fi
          done
        continue-on-error: true

      # 저널 기록은 이 봇의 유일한 영속 저장소다. 2026-08-08에 JOURNAL_PAT이 만료돼
      # 체크아웃이 'Bad credentials'로 실패했는데 continue-on-error 때문에 run은 계속
      # success로 표시됐고, **13일치 거래 기록이 조용히 유실**됐다(PSQ 44주 왕복 등).
      # 다시는 조용히 넘어가지 않도록 여기서 명시적으로 실패시킨다.
      - name: Verify journal write (실패를 조용히 넘기지 않음)
        if: always()
        run: |
          if [ ! -d journal/.git ]; then
            echo "::error::저널 체크아웃 실패 — JOURNAL_PAT 만료/무효 가능성. 거래기록이 저장되지 않는다."
            exit 1
          fi
          if ! git -C journal log -1 --format=%H >/dev/null 2>&1; then
            echo "::error::저널 저장소를 읽을 수 없다 — 기록 유실 위험."
            exit 1
          fi
          echo "저널 정상: $(git -C journal log -1 --format='%h %ad %s' --date=short)"

      - name: Upload trade log
        uses: actions/upload-artifact@v4
        with:
          name: trade-log
          path: logs/trades.csv
          overwrite: true
          retention-days: 90
        if: always()

      - name: Upload SQLite ledger
        uses: actions/upload-artifact@v4
        with:
          name: ledger-db
          path: logs/ledger.db
          overwrite: true
          retention-days: 180
        if: always()

      - name: Upload killswitch state
        uses: actions/upload-artifact@v4
        with:
          name: killswitch-state
          path: logs/killswitch.json
          overwrite: true
          retention-days: 90
        if: always()

      - name: Upload US positions
        uses: actions/upload-artifact@v4
        with:
          name: us-positions-state
          path: logs/us_positions.json
          overwrite: true
          retention-days: 7
        if: always()

      - name: Upload US slippage samples
        uses: actions/upload-artifact@v4
        with:
          name: us-slippage-log
          path: logs/us_slippage.json
          overwrite: true
          retention-days: 90
        if: always()

      - name: Upload learning data
        uses: actions/upload-artifact@v4
        with:
          name: learning-data
          path: |
            logs/market_history.json
            logs/ta_accuracy.json
            logs/experience.json
            logs/regime_memory.json
            logs/strategy_weights.json
            logs/fusion_weights.json
          overwrite: true
          retention-days: 180
        if: always()

      - name: Upload bear state
        uses: actions/upload-artifact@v4
        with:
          name: bear-state
          path: |
            logs/bear_state.json
            logs/bear_performance.json
          overwrite: true
          retention-days: 30
        if: always()
